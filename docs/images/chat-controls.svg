<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="VS Code chat: harness, agent mode, model and permissions"><rect x="0" y="0" width="960" height="600" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="30" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00594f" text-anchor="start">VS Code Chat — the 4 controls of every session</text><text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Drawing of the Chat view in the Copilot harness (VS Code, Nov 2026). Real screenshots are in Lab 00.</text><rect x="30" y="85" width="900" height="195" rx="12" fill="#0f2a33" stroke="#24414a" stroke-width="2"/><rect x="50" y="100" width="860" height="120" rx="8" fill="#123843" stroke="#2b5560" stroke-width="1.5"/><text x="70" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8aa3aa" text-anchor="start">Chat with Copilot</text><text x="70" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8aa3aa" text-anchor="start"></text><text x="560" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6f8a91" text-anchor="start">type # for context · / for skills &amp; commands</text><text x="68" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#d0dde0" text-anchor="start">+</text><rect x="95" y="180" width="250" height="28" rx="6" fill="#173f4b" stroke="#d97706" stroke-width="2"/><text x="110" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">⚙ Auto   │  Medium · 272K ▾</text><circle cx="880" cy="194" r="12" fill="#1e4d59"/><text x="880" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#d0dde0" text-anchor="middle">↑</text><rect x="50" y="232" width="120" height="32" rx="6" fill="#173f4b" stroke="#00a39a" stroke-width="2"/><text x="110" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Copilot ▾</text><rect x="185" y="232" width="140" height="32" rx="6" fill="#173f4b" stroke="#7c3aed" stroke-width="2"/><text x="255" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Interactive ▾</text><rect x="340" y="232" width="200" height="32" rx="6" fill="#173f4b" stroke="#dc2626" stroke-width="2"/><text x="440" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Manual permissions ▾</text><circle cx="50" cy="232" r="13" fill="#00a39a"/><text x="50" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="185" cy="232" r="13" fill="#7c3aed"/><text x="185" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="95" cy="180" r="13" fill="#d97706"/><text x="95" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="340" cy="232" r="13" fill="#dc2626"/><text x="340" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="560" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#a9c1c7" text-anchor="start">← one menu holds both: Agent mode + Permissions</text><rect x="30" y="300" width="440" height="100" rx="10" fill="#f8fafb" stroke="#00a39a" stroke-width="2"/><text x="46" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#00a39a" text-anchor="start">1  Harness  (docs: Session Target)</text><text x="46" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Copilot ✔ default · Local (deprecated) · Cloud</text><text x="46" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Claude / Codex only if your organisation allows them.</text><rect x="490" y="300" width="440" height="100" rx="10" fill="#f8fafb" stroke="#7c3aed" stroke-width="2"/><text x="506" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="start">2  Agent mode = HOW it works</text><text x="506" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Interactive ✔ today · Plan (plan first, run when approved)</text><text x="506" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Autopilot ✖ not today. Custom agents: agent dropdown (A2).</text><rect x="30" y="415" width="440" height="100" rx="10" fill="#f8fafb" stroke="#d97706" stroke-width="2"/><text x="46" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#d97706" text-anchor="start">3  Model + reasoning effort</text><text x="46" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Inside the chat box. Auto, or pick a model; Low · Medium · High.</text><text x="46" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Bigger model / higher effort = more AI credits.</text><rect x="490" y="415" width="440" height="100" rx="10" fill="#f8fafb" stroke="#dc2626" stroke-width="2"/><text x="506" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="start">4  Permissions = WHO signs off</text><text x="506" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Manual ✔ today · Assisted (AI judge) · Allow all ✖</text><text x="506" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">+ Sandboxing for terminal. Approve once / session / always.</text><text x="30" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="start">No “Ask” agent any more. Read-only = Interactive + “Do not change any files” + Manual.</text><text x="30" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00594f" text-anchor="start">Open Chat: Ctrl+Alt+I (Win/Linux) · ⌃⌘I (macOS)    Customizations: Ctrl+Shift+P → Chat: Open Customizations</text></svg>