<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="325" viewBox="0 0 1218 325" role="img" aria-label="Governance gates"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa5b1"/></marker></defs><rect width="1218" height="325" fill="#ffffff"/><text x="30" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00594f" text-anchor="start">Defence in depth for agent tools — every tool call passes 6 gates</text><rect x="20" y="95" width="110" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="75" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Agent wants</text><text x="75" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">to call a tool</text><path d="M132 135 L146 135" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="150" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="220.0" cy="98" r="17" fill="#0f766e"/><text x="220.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="220.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">Server design</text><text x="220.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">read-only vs</text><text x="220.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">destructive tools,</text><text x="220.0" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">annotations, schema</text><text x="220.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">MCP server code</text><path d="M292 155 L304 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="308" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="378.0" cy="98" r="17" fill="#2563eb"/><text x="378.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="378.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Server allow-list</text><text x="378.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">&quot;tools&quot;: [ … ]</text><text x="378.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">per server</text><text x="378.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">.mcp.json</text><path d="M450 155 L462 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="466" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><circle cx="536.0" cy="98" r="17" fill="#7c3aed"/><text x="536.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="536.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Agent tool list</text><text x="536.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">tools: [read,</text><text x="536.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">pensionRules/…]</text><text x="536.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">.agent.md</text><path d="M608 155 L620 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="624" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="3"/><circle cx="694.0" cy="98" r="17" fill="#d97706"/><text x="694.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="694.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">Human approval</text><text x="694.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">Manual permissions,</text><text x="694.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">allow once /</text><text x="694.0" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">session / always</text><text x="694.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">Chat UI</text><path d="M766 155 L778 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="782" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><circle cx="852.0" cy="98" r="17" fill="#ea580c"/><text x="852.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="852.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="middle">Hooks</text><text x="852.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">preToolUse deny</text><text x="852.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">+ audit log</text><text x="852.0" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">(deterministic)</text><text x="852.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">.github/hooks</text><path d="M924 155 L936 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="70" width="140" height="170" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><circle cx="1010.0" cy="98" r="17" fill="#dc2626"/><text x="1010.0" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="1010.0" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Org policy</text><text x="1010.0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">AI controls,</text><text x="1010.0" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">MCP allow-list,</text><text x="1010.0" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">managed settings</text><text x="1010.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#5f6b76" text-anchor="middle">GitHub admin</text><path d="M1082 155 L1094 155" stroke="#9aa5b1" stroke-width="3" marker-end="url(#a)"/><rect x="1098" y="115" width="95" height="80" rx="10" fill="#e3f4ea" stroke="#0f7b3e" stroke-width="2"/><text x="1145" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f7b3e" text-anchor="middle">Tool</text><text x="1145" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f7b3e" text-anchor="middle">runs</text><text x="150" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start"></text><text x="30" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Instructions and prompts are GUIDANCE. Gates 1–6 are CONTROLS. Layer 5 and 6 cannot be talked around by a prompt.</text></svg>