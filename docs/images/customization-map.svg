<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="463" viewBox="0 0 1000 463" role="img" aria-label="Customization map"><rect width="1000" height="463" fill="#ffffff"/><text x="30" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00594f" text-anchor="start">Which customization do I need?  (Copilot harness)</text><text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5f6b76" text-anchor="start">I need…</text><text x="430" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5f6b76" text-anchor="start">Use this file</text><text x="905" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5f6b76" text-anchor="start">Lab</text><rect x="30" y="84" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="84" width="8" height="44" fill="#d97706"/><text x="48" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">Always-on rules for the whole repo</text><text x="430" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">.github/copilot-instructions.md  or  AGENTS.md</text><text x="905" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">A4</text><rect x="30" y="136" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="136" width="8" height="44" fill="#d97706"/><text x="48" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">Rules only for some files</text><text x="430" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">.github/instructions/*.instructions.md  (applyTo: glob)</text><text x="905" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">A4</text><rect x="30" y="188" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="188" width="8" height="44" fill="#7c3aed"/><text x="48" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">A reusable ROLE with its own tools/model</text><text x="430" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">.github/agents/*.agent.md</text><text x="905" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">A2</text><rect x="30" y="240" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="240" width="8" height="44" fill="#d97706"/><text x="48" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">A reusable WORKFLOW with scripts &amp; references</text><text x="430" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">.github/skills/&lt;name&gt;/SKILL.md  → /name</text><text x="905" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">A4</text><rect x="30" y="292" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="292" width="8" height="44" fill="#0f766e"/><text x="48" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">Deterministic control at a lifecycle event</text><text x="430" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="start">.github/hooks/*.json  (preToolUse, sessionStart…)</text><text x="905" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="start">A1·A3</text><rect x="30" y="344" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="344" width="8" height="44" fill="#2563eb"/><text x="48" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">New tools / data from outside</text><text x="430" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">.mcp.json (repo root, mcpServers) or ~/.copilot/mcp-config.json</text><text x="905" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">A3</text><rect x="30" y="396" width="940" height="44" rx="8" fill="#f8fafb" stroke="#e3e8ec" stroke-width="1"/><rect x="30" y="396" width="8" height="44" fill="#dc2626"/><text x="48" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">Org-wide policy (cannot be bypassed locally)</text><text x="430" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">GitHub AI controls · enterprise-managed settings</text><text x="905" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">A1</text></svg>